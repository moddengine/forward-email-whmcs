name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: |
          # shellcheck disable=SC2016
          version=$(php -r '$m=json_decode(file_get_contents("forward_email/whmcs.json"), true, flags: JSON_THROW_ON_ERROR); echo $m["version"];')
          test "v$version" = "$GITHUB_REF_NAME"
          forward_email/build-release.sh "$RUNNER_TEMP/release"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/*.zip --generate-notes --verify-tag
